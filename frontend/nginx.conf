server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events must not be buffered by Nginx.
    location = /api/snacks/events {
        proxy_pass http://backend:8000/snacks/events;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
