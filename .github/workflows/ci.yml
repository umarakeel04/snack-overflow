name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    name: FastAPI lint and tests (PostgreSQL included)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snack
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: snackoverflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snack -d snackoverflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://snack:ci-only-password@localhost:5432/snackoverflow_test
      TEST_POSTGRES_URL: postgresql+psycopg://snack:ci-only-password@localhost:5432/snackoverflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint Python (Ruff)
        working-directory: backend
        run: python -m ruff check app tests
      - name: Run tests (including real Postgres contention)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: React lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint React and TypeScript (ESLint)
        working-directory: frontend
        run: npm run lint
      - name: Test optimistic UI projections
        working-directory: frontend
        run: npm run test:optimistic
      - name: Test SSE frame parsing
        working-directory: frontend
        run: npm run test:realtime
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
